<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Blog Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Floating Label Styles */
        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 0.5rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            background: #f8fafc;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-input.error {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .form-input.success {
            border-color: #22c55e;
        }

        .form-label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.2s ease;
            background: transparent;
            padding: 0 4px;
        }

        .form-textarea~.form-label {
            top: 1.2rem;
            transform: translateY(0);
        }

        .form-input:focus~.form-label,
        .form-input:not(:placeholder-shown)~.form-label,
        .form-input:valid~.form-label {
            top: 0;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #3b82f6;
            background: white;
        }

        .form-input.error:focus~.form-label,
        .form-input.error:not(:placeholder-shown)~.form-label {
            color: #ef4444;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            margin-left: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Spinner Animation */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Toast Animations */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideInRight 0.4s ease forwards;
        }

        .toast-exit {
            animation: slideOutRight 0.4s ease forwards;
        }

        /* Custom Select Dropdown Styling */
        select.form-input {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        /* File Input Styling */
        .file-upload-area {
            border: 2px dashed #e2e8f0;
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .file-upload-area:hover,
        .file-upload-area.dragover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .file-upload-area.has-file {
            border-color: #22c55e;
            background: #f0fdf4;
        }
    </style>
</head>

<body class="font-sans flex items-center justify-center p-4">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- Form Container -->
    <div
        class="glass-card p-8 md:p-10 rounded-2xl shadow-2xl w-full max-w-xl transform transition-all duration-300 hover:shadow-3xl">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 text-blue-600 rounded-full mb-4">
                <i data-lucide="pen-tool" class="w-7 h-7"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">Create a New Post</h2>
            <p class="text-gray-500 mt-1 text-sm">Share your insights with the community</p>
        </div>

        <!-- Form -->
        <form id="createBlogForm" novalidate>

            <!-- Blog Title -->
            <div class="form-group">
                <input type="text" id="title" name="title" class="form-input peer" placeholder=" " required
                    minlength="5" />
                <label for="title" class="form-label">Blog Title</label>
                <p id="titleError" class="error-message">Title must be at least 5 characters.</p>
            </div>

            <!-- Blog Content -->
            <div class="form-group">
                <textarea id="content" name="content" rows="4" class="form-input peer" placeholder=" " required
                    minlength="20"></textarea>
                <label for="content" class="form-label">Content</label>
                <p id="contentError" class="error-message">Content must be at least 20 characters.</p>
            </div>

            <!-- Tags -->
            <div class="form-group">
                <input type="text" id="tags" name="tags" class="form-input peer" placeholder=" " />
                <label for="tags" class="form-label">Tags (comma separated)</label>
            </div>

            <!-- Organization Dropdown -->
            <div class="form-group">
                <div class="relative">
                    <select id="organization" name="organization" class="form-input peer" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Collabuilder">Collabuilder</option>
                        <option value="Kynyx">Kynyx</option>
                        <option value="Homeasy">Homeasy</option>
                        <option value="Aiexperts">Aiexperts</option>
                    </select>
                    <label for="organization" class="form-label">Organization</label>
                    <div
                        class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 peer-focus:text-blue-500">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>
                <p id="organizationError" class="error-message">Please select an organization.</p>
            </div>

            <!-- Featured Checkbox -->
            <div class="form-group flex items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                <div class="relative flex items-center justify-center">
                    <input type="checkbox" id="isFeatured" name="isFeatured" class="peer sr-only" />
                    <label for="isFeatured" class="flex items-center cursor-pointer">
                        <div
                            class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500 shadow-inner">
                        </div>
                        <span class="ml-3 text-sm font-semibold text-gray-700">Mark as Featured</span>
                    </label>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="form-group">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Image</label>
                <div id="dropZone" class="file-upload-area">
                    <input type="file" id="image" name="image" accept="image/*" class="hidden" />
                    <div id="uploadPlaceholder">
                        <i data-lucide="upload-cloud" class="w-8 h-8 mx-auto text-gray-400 mb-2"></i>
                        <p class="text-sm text-gray-500"><span class="font-semibold text-blue-500">Click to
                                upload</span> or drag and drop</p>
                        <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF up to 5MB</p>
                    </div>
                    <div id="uploadSuccess" class="hidden flex items-center justify-center gap-2 text-green-600">
                        <i data-lucide="image" class="w-5 h-5"></i>
                        <span id="fileName" class="text-sm font-medium truncate"></span>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-8">
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 text-white px-6 py-3.5 rounded-xl font-bold text-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                    <span id="btnText">Publish Blog Post</span>
                    <i data-lucide="arrow-right" class="w-5 h-5" id="btnIcon"></i>
                    <!-- Loading Spinner (Hidden by default) -->
                    <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </div>
        </form>

    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const form = document.getElementById('createBlogForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        // File Upload Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('image');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const uploadSuccess = document.getElementById('uploadSuccess');
        const fileNameSpan = document.getElementById('fileName');

        // --- File Upload Handling ---
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (file) {
                fileNameSpan.textContent = file.name;
                uploadPlaceholder.classList.add('hidden');
                uploadSuccess.classList.remove('hidden');
                dropZone.classList.add('has-file');
                lucide.createIcons(); // Re-render icons
            }
        }

        // --- Real-Time Validation ---
        const inputs = form.querySelectorAll('.form-input[required]');
        inputs.forEach(input => {
            input.addEventListener('input', () => validateField(input));
            input.addEventListener('blur', () => validateField(input));
        });

        function validateField(field) {
            const errorEl = document.getElementById(`${field.id}Error`);
            let isValid = true;

            if (field.tagName === 'SELECT') {
                isValid = field.value !== '';
            } else {
                isValid = field.checkValidity();
            }

            if (!isValid) {
                field.classList.add('error');
                field.classList.remove('success');
                if (errorEl) errorEl.classList.add('show');
            } else {
                field.classList.remove('error');
                // Only show success border if user has typed something
                if (field.value !== '') {
                    field.classList.add('success');
                }
                if (errorEl) errorEl.classList.remove('show');
            }
            return isValid;
        }

        // --- Form Submission ---
        form.addEventListener('submit', function (event) {
            event.preventDefault();

            // Trigger validation on all required fields
            let isFormValid = true;
            inputs.forEach(input => {
                if (!validateField(input)) {
                    isFormValid = false;
                }
            });

            if (!isFormValid) {
                showToast('Please fix the errors in the form.', 'error');
                return;
            }

            // Set Loading State
            setLoadingState(true);

            // Gather Data
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const tags = document.getElementById('tags').value.split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            const organization = document.getElementById('organization').value;
            const isFeatured = document.getElementById('isFeatured').checked;
            const image = document.getElementById('image').files[0];

            const formData = new FormData();
            formData.append('title', title);
            formData.append('content', content);
            formData.append('tags', JSON.stringify(tags));
            formData.append('organization', organization);
            formData.append('isFeatured', isFeatured);
            if (image) {
                formData.append('image', image);
            }

            // Simulate API Call (Replace with actual fetch)
            setTimeout(() => {

                fetch('/api/blogs', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })


                // Simulating Success for demonstration
                setLoadingState(false);
                showToast('Blog post published successfully!', 'success');
                form.reset();

                // Reset custom UI states
                uploadPlaceholder.classList.remove('hidden');
                uploadSuccess.classList.add('hidden');
                dropZone.classList.remove('has-file');
                document.querySelectorAll('.form-input').forEach(i => i.classList.remove('success', 'error'));
                document.querySelectorAll('.error-message').forEach(e => e.classList.remove('show'));

            }, 2000); // 2 second simulated delay
        });

        function setLoadingState(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Publishing...';
                btnIcon.classList.add('hidden');
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.textContent = 'Publish Blog Post';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        // --- Toast Notifications ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';

            toast.className = `${bgColor} text-white px-5 py-4 rounded-xl shadow-lg flex items-center gap-3 min-w-[300px] toast-enter`;
            toast.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i>
        <span class="text-sm font-medium">${message}</span>
      `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }
    </script>

</body>

</html>
